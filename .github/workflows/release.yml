name: release

# 打 v 前缀 tag（如 v2.0.0）即自动构建六个平台的单执行文件并发布到 GitHub Release。
# 版本口径：2.x 起为 Go 单执行文件实现；1.x 是 Laravel 版，代码归档在 laravel 分支。
# 也可在 Actions 页手动触发（workflow_dispatch）以便验证流水线本身。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '写入二进制的版本号（默认 dev）'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # git describe 需要完整历史与 tag 才能推出版本号
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false  # 零外部依赖、无 go.sum，开缓存每轮都报 restore failed

      - name: 校验 Go 代码
        run: |
          test -z "$(gofmt -l .)" || { echo '以下文件未格式化：'; gofmt -l .; exit 1; }
          go vet ./...
          go test ./... -count=1

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建前端产物并交叉编译六个目标
        shell: bash
        # build.sh 会先 pnpm install --frozen-lockfile + pnpm build 产出 web/dist，再交叉编译六个目标。
        run: bash ./scripts/build.sh '${{ steps.ver.outputs.version }}'

      - name: 生成校验和
        working-directory: bin
        run: sha256sum ./* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ver.outputs.version }}
          files: |
            bin/zerotier-webui-*
            bin/checksums.txt
          # 手动触发时不建 release，只验证流水线能跑通
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
        if: github.event_name == 'push'
